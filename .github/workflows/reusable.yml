name: Shared CI (reusable)

on:
  workflow_call:
    inputs:
      config-path:
        description: Path to ci.project.json in the caller repository
        required: false
        type: string
        default: ci.project.json
      platform-ref:
        description: Full 40-character reviewed shared-ci-platform commit SHA to execute
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    # Reusable workflows inherit the caller's event/ref context. Keep this job
    # manual-only and require the caller branch to have GitHub protection enabled.
    if: github.event_name == 'workflow_dispatch' && github.ref_protected == true
    runs-on: [self-hosted, Windows, X64, shared-ci]
    timeout-minutes: 45
    steps:
      - name: Validate immutable platform commit
        id: validate-platform-ref
        shell: pwsh
        env:
          PLATFORM_REF: ${{ inputs.platform-ref }}
        run: |
          if ($env:PLATFORM_REF -notmatch '^[0-9a-fA-F]{40}$') {
            throw "platform-ref must be a full 40-character commit SHA."
          }

      - name: Checkout caller repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: project
          persist-credentials: false

      - name: Checkout shared CI platform
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sajadk2040-create/shared-ci-platform
          ref: ${{ inputs.platform-ref }}
          path: _shared-ci-platform
          persist-credentials: false

      - name: Verify PowerShell 7
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) {
            throw "PowerShell 7 or newer is required."
          }

      - name: Validate shared CI core runner
        shell: pwsh
        run: |
          pwsh -NoProfile -File _shared-ci-platform/tests/Invoke-RunnerSmokeTests.ps1

      - name: Validate shared CI host safety scripts
        shell: pwsh
        run: |
          pwsh -NoProfile -File _shared-ci-platform/tests/Invoke-RunnerHostSafetyTests.ps1

      - name: Validate real Windows filesystem links
        shell: pwsh
        run: |
          pwsh -NoProfile -File _shared-ci-platform/tests/Invoke-RunnerFilesystemLinkIntegrationTests.ps1 -EnableFilesystemLinkTests

      - name: Run shared CI
        shell: pwsh
        working-directory: project
        env:
          SHARED_CI_CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          # Keep report output predictable for the artifact-upload step.
          ../_shared-ci-platform/scripts/run.ps1 -ConfigPath $env:SHARED_CI_CONFIG_PATH -OutputDirectory artifacts/ci

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shared-ci-report-${{ github.run_id }}
          path: project/artifacts/ci/
          if-no-files-found: warn
          retention-days: 3
